<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تسجيل الطلاب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>نموذج تسجيل طالب</h1>
        <form id="registrationForm">
            <div class="form-group">
                <label for="studentName">اسم الطالب:</label>
                <input type="text" id="studentName" name="studentName" required>
            </div>
            <div class="form-group">
                <label for="studentId">رقم الهوية:</label>
                <input type="text" id="studentId" name="studentId" required>
            </div>
            <div class="form-group">
                <label for="parentPhone">رقم هاتف ولي الأمر:</label>
                <input type="tel" id="parentPhone" name="parentPhone" required>
            </div>
            <div class="form-group">
                <label for="stage">المرحلة الدراسية:</label>
                <select id="stage" name="stage" required>
                    <option value="">اختر المرحلة</option>
                    <option value="preschool">تمهيدي</option>
                    <option value="elementary_boys">ابتدائي بنين</option>
                    <option value="middle_boys">متوسط بنين</option>
                    <option value="high_boys">ثانوي بنين</option>
                    <option value="elementary_girls">ابتدائي بنات</option>
                    <option value="middle_girls">متوسط بنات</option>
                    <option value="high_girls">ثانوي بنات</option>
                </select>
            </div>
            <div class="form-group">
                <label for="track">المسار:</label>
                <select id="track" name="track" required disabled>
                    <option value="">اختر المسار</option>
                </select>
            </div>
            <div class="form-group">
                <label for="grade">القسم:</label>
                <select id="grade" name="grade" required disabled>
                    <option value="">اختر القسم</option>
                </select>
            </div>
            <button type="submit">تسجيل</button>
        </form>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
